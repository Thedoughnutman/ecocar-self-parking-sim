name: steering_saturates_20deg
description: Mid-maneuver the EPS can't go past 20 deg of road-wheel angle. The car either doesn't need more, or stops.
flows: [single_stall, search]
events:
  - {after_state: MANEUVERING, delay_s: 3.0, set: {eps_saturation_deg: 20.0}}
expect:
  outcome_one_of: [completed, fault]
  no_contact: true
