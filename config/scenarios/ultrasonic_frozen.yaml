name: ultrasonic_frozen
description: Mid-maneuver the ultrasonics keep publishing with new timestamps, but their values stop changing.
flows: [single_stall, search]
events:
  - {after_state: MANEUVERING, delay_s: 3.0, set: {sensor_frozen: [ultrasonic]}}
expect:
  outcome: aborted
  abort_reason: sensor_stale
